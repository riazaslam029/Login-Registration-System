name: Bug report
description: Report a reproducible problem with the application.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the smallest set of steps that reproduces the problem.
      placeholder: "1. Build the project...\n2. Select...\n3. Enter..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your Windows version, Visual Studio version, and selected platform.
